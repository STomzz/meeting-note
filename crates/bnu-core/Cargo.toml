[package]
name = "bnu-core"
version = "0.1.0"
edition = "2021"
description = "BNU Notes 核心库：vault 索引、Markdown 分块、全文检索"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2.5"
anyhow = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
