[package]
name = "bnu-core"
version = "0.1.0"
edition = "2021"
description = "BNU Notes 核心库：vault 索引、Markdown 分块、全文检索"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2.5"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "rustls-tls-native-roots",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
