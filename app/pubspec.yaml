publish_to: "none"
version: 0.2.1+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  path: ^1.9.0
  record: ^7.1.1
  path_provider: ^2.1.4
  sqflite: ^2.3.3
  shared_preferences: ^2.3.2
  file_picker: ^13.1.0
  share_plus: ^13.3.0
  wakelock_plus: ^1.8.0
  flutter_foreground_task: ^11.0.3
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
