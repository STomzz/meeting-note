name: CI

on:
  push:
    branches: [main, client]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # 日常校验：前端构建 + 核心库测试 + Tauri 壳编译（Linux）
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test -p bnu-core
      - run: cargo check -p bnu-notes

  # Windows 安装包：推送 v* 标签自动出包并挂到 Release；也可在 Actions 页手动触发
  windows-build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run tauri build
      # 诊断：产物到底落在哪（本仓库是 cargo workspace，target 目录在仓库根）
      - name: Locate bundles
        shell: pwsh
        run: Get-ChildItem -Recurse -Path target/release/bundle -File -ErrorAction SilentlyContinue | Select-Object FullName, Length
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bnu-notes-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BNU Notes ${{ github.ref_name }}
          body: |
            **Windows**（Tauri 2 + WebView2，Windows 10/11 x64）

            - `*-setup.exe`：NSIS 安装包（推荐，双击即装）
            - `*.msi`：MSI 安装包（企业分发/静默安装用）

            **Android**（arm64-v8a，Android 8+）

            - `bnu-notes-<版本>.apk`：手机上下载直接安装；与历史版本**同一签名**，
              可覆盖升级、数据不丢（手机设置里允许「安装未知来源应用」即可）

            安装包内**不含任何密钥**；模型网关地址与 API Key 请在应用内「设置 → 模型能力」中填写。
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          draft: false
          prerelease: false

  # Android APK：推送 v* 标签自动出包并挂到同一个 Release。
  # 需要 4 个 repository secrets（缺任何一个就自动跳过，不影响 Windows 出包）：
  #   ANDROID_KEYSTORE_BASE64      base64 -w0 ~/.android/bnu-notes.keystore
  #   ANDROID_KEYSTORE_PASSWORD    keystore.properties 里的 storePassword
  #   ANDROID_KEY_ALIAS            keyAlias
  #   ANDROID_KEY_PASSWORD         keyPassword
  # 详见 docs/android.md「Release 里带 APK」。
  android-build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
      - name: 有没有签名 secrets
        id: ks
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KEY_ALIAS" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 ANDROID_KEYSTORE_* secrets，跳过 Android 出包（见 docs/android.md）"
          fi
      - if: steps.ks.outputs.ready == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.ks.outputs.ready == 'yes'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: steps.ks.outputs.ready == 'yes'
        name: 准备 Android SDK / NDK（优先用 runner 自带的，缺了才下载 cmdline-tools）
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/android-build.log) 2>&1
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK="$RUNNER_TEMP/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$(dirname "$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)")"
          echo "用 $SDKM/sdkmanager"
          echo "$SDKM" >> "$GITHUB_PATH"
          yes | "$SDKM/sdkmanager" --licenses > /dev/null || true
          "$SDKM/sdkmanager" --install "platform-tools" "platforms;android-36" \
            "build-tools;36.0.0" "ndk;$NDK_VERSION"
          "$SDKM/sdkmanager" --list_installed | sed -n '1,15p'
      - if: steps.ks.outputs.ready == 'yes'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - if: steps.ks.outputs.ready == 'yes'
        uses: Swatinem/rust-cache@v2
      - if: steps.ks.outputs.ready == 'yes'
        name: 解出签名密钥库
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/bnu-notes.keystore"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/bnu-notes.keystore
          keyAlias=$KEY_ALIAS
          storePassword=$KS_PASS
          keyPassword=$KEY_PASS
          EOF
      - if: steps.ks.outputs.ready == 'yes'
        run: npm ci
      - if: steps.ks.outputs.ready == 'yes'
        name: 构建 APK
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/android-build.log) 2>&1
          export NDK_HOME="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          npm run tauri android build -- --apk --target aarch64
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
             "bnu-notes-${GITHUB_REF_NAME}.apk"
      - if: steps.ks.outputs.ready == 'yes' && startsWith(github.ref, 'refs/tags/v')
        name: 挂到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: bnu-notes-*.apk
      - if: steps.ks.outputs.ready == 'yes' && !startsWith(github.ref, 'refs/tags/v')
        name: 手动触发时上传 artifact（验证用，不建 Release）
        uses: actions/upload-artifact@v4
        with:
          name: bnu-notes-android
          path: bnu-notes-*.apk
      # 失败兜底：日志进 ci-logs 分支，方便排查（artifact/日志接口有时读不到）
      - if: failure() && steps.ks.outputs.ready == 'yes'
        name: 失败日志推到 ci-logs 分支
        run: |
          set -e
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-logs
          { echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; \
            echo "ref: ${GITHUB_REF}  time: $(date -u +%FT%TZ)"; echo "----"; \
            tail -300 /tmp/android-build.log 2>/dev/null || echo "(没有抓到构建日志)"; } > ci-logs/last-android-failure.log
          git checkout -B ci-logs
          git add -f ci-logs/last-android-failure.log
          git commit -m "ci: android-build 失败日志（run ${GITHUB_RUN_ID}）"
          git push -f origin ci-logs
