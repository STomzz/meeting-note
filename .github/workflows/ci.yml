name: CI

on:
  push:
    branches: [main, client]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # 日常校验：前端构建 + 核心库测试 + Tauri 壳编译（Linux）
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test -p bnu-core
      - run: cargo check -p bnu-notes

  # Windows 安装包：推送 v* 标签自动出包并挂到 Release；也可在 Actions 页手动触发
  windows-build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run tauri build
      # 诊断：产物到底落在哪（本仓库是 cargo workspace，target 目录在仓库根）
      - name: Locate bundles
        shell: pwsh
        run: Get-ChildItem -Recurse -Path target/release/bundle -File -ErrorAction SilentlyContinue | Select-Object FullName, Length
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bnu-notes-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BNU Notes ${{ github.ref_name }} (Windows)
          body: |
            Windows 安装包（Tauri 2 + WebView2，Windows 10/11 x64）。

            - `*-setup.exe`：NSIS 安装包（推荐，双击即装）
            - `*.msi`：MSI 安装包（企业分发/静默安装用）

            安装包内**不含任何密钥**；模型网关地址与 API Key 请在应用内「设置 → 模型能力」中填写。
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          draft: false
          prerelease: false
